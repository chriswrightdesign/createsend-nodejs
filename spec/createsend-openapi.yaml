          format: int32
        RecordsOnThisPage:
          type: integer
          format: int32
        TotalNumberOfRecords:
          type: integer
          format: int32
        NumberOfPages:
          type: integer
          format: int32
      x-data-contract-name: PagedResult
    ClientAccessEnum:
      type: string
      enum:
      - None
      - Reports
      - ManageLists
      - CreateCampaigns
      - DesignAndSpamTest
      - ImportSubscribers
      - ImportDesignFromURL
      - SendCampaigns
      - SubscribersInReports
      - ImportBuildTemplates
      - AdministerPersons
      - AdministerAccount
      - ViewIdentity
      - Transactional
