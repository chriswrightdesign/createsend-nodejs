openapi: 3.0.3
info:
  title: Campaign Monitor API
  description: OpenAPI specification covering the Campaign Monitor RESTful API. Generated from the source of CampMon.RESTfulAPI and CampMon.RESTfulAPI.Transactional ASP.NET MVC projects. Routes are sourced from each project; request bodies and response models are inferred from controller signatures and the service-layer methods they call.
  version: 3.4
servers:
- url: https://api.createsend.com/api
  description: Production
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: basic
      description: HTTP Basic auth with the account API key as the username and any non-empty string as the password.
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://api.createsend.com/oauth
          tokenUrl: https://api.createsend.com/oauth/token
          scopes: {}
  schemas:
    Result:
      type: object
      properties:
        Success:
          $ref: '#/components/schemas/Result'
        DatabaseError:
          $ref: '#/components/schemas/Result'
        Code:
          type: integer
          format: int64
        Message:
          type: string
      x-data-contract-name: Result
    DetailedCampaignWithWebversion:
      type: object
      properties:
        WebVersionURL:
          type: string
        WebVersionTextURL:
          type: string
        Tags:
          type: array
          items:
            type: string
      x-data-contract-name: Campaign
    RESTFulDetailedCampaignCollection:
      type: array
      items:
        $ref: '#/components/schemas/DetailedCampaignWithWebversion'
    PagedResult_RESTFulDetailedCampaignCollection_DetailedCampaignWithWebversion:
      type: object
      properties:
        Results:
          $ref: '#/components/schemas/RESTFulDetailedCampaignCollection'
        ResultsOrderedBy:
          type: string
        OrderDirection:
          type: string
        PageNumber:
          type: integer
          format: int32
        PageSize:
          type: integer
          format: int32
        RecordsOnThisPage:
          type: integer
          format: int32
        TotalNumberOfRecords:
          type: integer
          format: int32
        NumberOfPages:
          type: integer
          format: int32
      x-data-contract-name: PagedResult
    BasicWorkflowModel:
      type: object
      properties:
        ListID:
          type: string
        JourneyID:
          type: string
        Name:
          type: string
        Status:
          type: string
        EmailCount:
          type: integer
          format: int32
        EmailsSent:
          type: integer
          format: int32
      x-data-contract-name: Journey
    BasicWorkflowCollection:
      type: array
      items:
