openapi: 3.0.3
info:
  title: Campaign Monitor API
  description: OpenAPI specification covering the Campaign Monitor RESTful API. Generated from the source of CampMon.RESTfulAPI and CampMon.RESTfulAPI.Transactional ASP.NET MVC projects. Routes are sourced from each project's Global.asax.cs; request bodies and response models are inferred from controller signatures and the service-layer methods they call.
  version: 3.4
servers:
- url: https://api.createsend.com/api
  description: Production
