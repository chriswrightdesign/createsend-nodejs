        NextTier:
          $ref: '#/components/schemas/TieredPaymentRate'
          description: NextTier is set by a call to GetActionCost as the tier to which this payment will elevate the client
        BillingPeriodStartDate:
          type: string
          format: date-time
          description: Called when we need to figure out the start date of the current billing Period by going back one month. Doesn't modify the model or save to the database
