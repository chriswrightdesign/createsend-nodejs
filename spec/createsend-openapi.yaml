      properties:
        DeliveryFeeInCents:
          type: integer
          format: int32
        DeliveryFeeInDollars:
          type: number
          format: double
        CostPerRecipient:
          type: number
          format: double
        DesignAndSpamTestFeeInCents:
          type: integer
          format: int32
        DesignAndSpamTestFeeInDollars:
          type: number
          format: double
        CreditPaymentRates:
          type: array
          items:
            $ref: '#/components/schemas/TieredPaymentRate'
        AddOnPaymentRates:
          type: object
          additionalProperties:
            type: array
            items:
