          format: date-time
        DiscountExpiryForDisplay:
          type: string
        DiscountExpiryOfferCodeDateForDisplay:
          type: string
        ExpiryDateBeforeRedemptionUtc:
          type: string
          format: date-time
        PartnershipDetails:
          $ref: '#/components/schemas/PartnershipDetails'
        IsAdmin:
          type: boolean
        PlanIDForDiscount:
          $ref: '#/components/schemas/PlanIDForDiscount'
        WebsiteUrl:
          type: string
        HasPlanSpecificDiscount:
          type: boolean
        PartnershipClass:
          type: string
        PendingDiscountType:
          $ref: '#/components/schemas/DiscountType'
        DiscountType:
          $ref: '#/components/schemas/DiscountType'
        DiscountActivationStatus:
          type: string
        HasPendingDiscountApplied:
          type: boolean
        DiscountPercentageForDisplay:
          type: string
        PendingDiscountPercentageForDisplay:
          type: string
        HasDiscountApplied:
          type: boolean
        PartnershipGranted:
          type: boolean
        ShowDiscount:
          type: boolean
        ShowActivationReminder:
          type: boolean
        DiscountReasonForDisplayWithPrefix:
          type: string
        PendingDiscountReasonForDisplayWithPrefix:
          type: string
        DiscountReasonForDisplay:
          type: string
        PendingDiscountReasonForDisplay:
          type: string
        DiscountReasonForDisplayLower:
