          type: boolean
        IsBilledOutOfApp:
          type: boolean
        DiscountReasonsToShow:
          type: array
          items:
            type: string
    MarkupType:
      type: string
      enum:
      - Custom
      - PublicBaseRates
      - Percentage
    TieredPaymentRate:
      type: object
      properties:
        RateInCents:
          type: number
          format: double
        TierID:
          type: integer
          format: int32
          description: MonthlySendLimitID (not MonthlyTierID), or CreditBracketID
        UpperBoundInclusive:
          type: integer
          format: int32
        LowerBoundExclusive:
          type: integer
          format: int32
        PricingCategory:
          $ref: '#/components/schemas/PricingCategory'
        SendLimit:
          type: integer
          format: int32
          description: If SendLimit is null, it is because this tier does not have a campaign sending limit
        TransactionalSendLimit:
          type: integer
          format: int64
          description: Gets transactional send limit for "Unlimited" and "Basic with unlimited sends" monthly plans Gets transactional send limit for BasicWithNoLimit, Unlimited, Premier, Essentials or Growth. If null, transactional is not allowed or send limits are aggregated with campaign send limits (SendLimit).
        CreditBracketDescription:
          type: string
        SubscriberRange:
          type: string
        MonthlyTierDescription:
          type: string
    BillingFeature:
      type: string
      enum:
      - None
      - Sms
      - MachineClicks
      - EngagementSegments
      - LiveContent
      - WebsiteBuilder
    AddOnTieredPaymentRate:
      type: object
      properties:
        PricingFamilyID:
          type: integer
          format: int32
          description: Note this is an integer like 1 or 37, not a member of the PricingFamily enum (which has values like 1000 or 37000)
        Currency:
          type: string
        BillingFeatureID:
          $ref: '#/components/schemas/BillingFeature'
        UpperBoundInclusive:
          type: integer
          format: int32
        LowerBoundExclusive:
          type: integer
          format: int32
        RateInMinorUnit:
          type: number
          format: double
        CreditBracketDescription:
          type: string
    PaygPaymentRate:
